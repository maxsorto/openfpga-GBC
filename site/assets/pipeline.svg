    <text x="30" y="40" fill="#8a93ad" font-size="12">ON THE MAC</text>
    <text x="30" y="200" fill="#8a93ad" font-size="12">ON THE SD CARD</text>
    <text x="30" y="306" fill="#8a93ad" font-size="12">INSIDE THE FPGA CORE</text>
  </g>
  <g stroke="#3a4054" stroke-width="1.5" fill="#1b2030">
